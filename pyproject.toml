[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-ai-academy"
version = "0.1.0"
description = "Framework-neutral reference implementation and curriculum for trustworthy Agentic AI engineering."
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Hendar Mawan, PhD"}]
license = {text = "MIT"}
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1", "PyYAML>=6,<7"]
demo = ["gradio>=5,<7", "streamlit>=1.38,<2"]
providers = ["openai>=1.0,<2", "anthropic>=0.40,<1", "google-genai>=1,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests", "evaluation/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"deploy/streamlit/app.py" = ["I001"]
