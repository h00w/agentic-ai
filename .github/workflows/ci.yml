name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e .[dev]
      - run: ruff format --check .
      - run: ruff check .
      - run: pytest
      - run: pytest tests/test_providers.py evaluation/tests/test_provider_benchmark.py
      - run: python scripts/validate_examples.py
      - run: python scripts/check_links.py
      - run: python scripts/validate_benchmark_dataset.py
      - run: python scripts/audit_curriculum.py
      - run: python scripts/build_catalog.py --check
