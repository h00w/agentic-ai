changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot
  categories:
    - title: "🚀 Features and curriculum"
      labels:
        - enhancement
        - curriculum
        - feature
    - title: "🛡️ Security and governance"
      labels:
        - security
        - governance
    - title: "🧪 Evaluation and reliability"
      labels:
        - evaluation
        - testing
        - reliability
    - title: "📚 Documentation"
      labels:
        - documentation
    - title: "🐛 Fixes"
      labels:
        - bug
    - title: "Other changes"
      labels:
        - "*"
